label{display:block;font-size:13px;font-weight:500;margin-bottom:4px}

.fb>div{min-width:160px}

.mo{position:fixed;inset:0;background:rgba(10,20,35,.55);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:5vh 12px;overflow:auto}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:#12345A;color:#fff;padding:10px 16px;border-radius:8px;z-index:60;max-width:90vw}
.empty{text-align:center;padding:34px 12px;color:var(--mu)}
.login{min-height:100vh;display:grid;place-items:center;padding:20px}
.lc{width:100%;max-width:420px}.lc .brand{color:var(--p9);padding-left:0}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}

.side.open{transform:none}.burger{display:inline-flex}.top,.page{padding-left:14px;padding-right:14px}.who{display:none}.kv{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

 <div><label>Tanggal aktivitas</label><input type="date" name="date" value="${TODAY}" required></div>
 <div><label>Jenis aktivitas</label>${sel('type',Object.entries(TY),'oplah')}</div>
 <div data-t="oplah"><label>Sumber oplah</label>${sel('src',['Agen','Loper','Pembaca'].map(x=>[x,x]),'Agen')}</div>
 <div data-t="oplah"><label>Nama agen/loper/pembaca</label><input name="nm"></div>
 <div data-t="oplah"><label>Jumlah (eksemplar)</label><input type="number" name="q" min="1"></div>
 <div data-t="profiling program penawaran"><label>Client</label>${sel('client',CL.map(c=>[c,c]),CL[0])}</div>
 <div data-t="profiling"><label>Potensi</label>${sel('pot',['Tinggi','Sedang','Rendah'].map(x=>[x,x]),'Sedang')}</div>
 <div data-t="progress hasil"><label>Penawaran</label>${sel('offer',ofs,'o1')}</div>
 <div data-t="hasil"><label>Hasil akhir</label>${sel('res',[['deal','Deal'],['no','NO']],'deal')}</div>
 <div data-t="no"><label>Kategori alasan NO</label>${sel('cat',NOC.map(x=>[x,x]),'',  'Pilih kategori')}<div class="hint">Kategori masih sementara sampai dikonfirmasi mitra.</div></div>
 <div data-t="no" class="full"><label>Penjelasan alasan NO</label><textarea name="why" rows="2"></textarea></div>
 <div data-t="penawaran"><label>Nilai penawaran (Rp)</label><input type="number" name="val" min="0"></div>
 <div class="full"><label>Deskripsi</label><textarea name="desc" rows="3" placeholder="Jelaskan cukup rinci agar bisa diverifikasi"></textarea></div>
 </div><div class="fb" style="margin:16px 0 0"><button class="btn" type="submit">Simpan aktivitas</button><button class="btn s" type="button" data-a="nav" data-p="activities">Batal</button></div></form>`]},
verifications(){const r=A.filter(a=>vis(a)&&['pending'].includes(a.status)).map(a=>`<tr><td>${fmt(a.date)}</td><td>${TY[a.type]}</td><td>${nm(a.owner)}</td><td>${nm(a.by)}</td><td>${esc(a.desc)}</td><td>${canVerify(a)?'<button class="btn sm" data-a="open" data-id="'+a.id+'">Periksa</button>':'<span class="hint">Tidak dapat memverifikasi aktivitas sendiri</span>'}</td></tr>`);
 return['Verifikasi','Hanya aktivitas yang disetujui masuk perhitungan realisasi KPI.',tbl(['Tanggal','Jenis','Pemilik','Pencatat','Deskripsi','Aksi'],r,'Tidak ada aktivitas yang menunggu verifikasi.')]},
offers(){const r=O.filter(o=>team().includes(o.owner)||S.role==='hrd').map(o=>`<tr><td>${esc(o.client)}</td><td>${esc(o.prog)}</td><td class="n">${rp(o.val)}</td><td>${nm(o.owner)}</td><td class="n">${o.pr.length}</td><td>${o.out?badge(o.out.r):'<span class="b mu"><i></i>Berjalan</span>'}</td><td><button class="btn sm s" data-a="offer" data-id="${o.id}">Detail</button></td></tr>`);
 return['Penawaran','Satu penawaran dapat memiliki banyak progress dan satu hasil akhir.',tbl(['Client','Program','#Nilai','Pemilik','#Progress','Hasil',''],r)]},
oplah(){return mk('oplah','Oplah','Pencatatan perolehan oplah dari agen, loper, dan pembaca.',['Tanggal','Sumber','Nama','#Eksemplar','Pemilik','Status'],a=>`<tr><td>${fmt(a.date)}</td><td>${a.src}</td><td>${esc(a.nm||'-')}</td><td class="n">${a.q}</td><td>${nm(a.owner)}</td><td>${badge(a.status)}</td></tr>`)},
programs(){return mk('program','Program/barter','Program kerja sama dan barter dengan client.',['Tanggal','Client','Deskripsi','Pemilik','Status'],a=>`<tr><td>${fmt(a.date)}</td><td>${esc(a.client)}</td><td>${esc(a.desc)}</td><td>${nm(a.owner)}</td><td>${badge(a.status)}</td></tr>`)},
profiling(){return mk('profiling','Riset profiling','Hasil riset profil client dan potensi kerja sama.',['Tanggal','Client','Potensi','Deskripsi','Pemilik','Status'],a=>`<tr><td>${fmt(a.date)}</td><td>${esc(a.client)}</td><td>${a.pot}</td><td>${esc(a.desc)}</td><td>${nm(a.owner)}</td><td>${badge(a.status)}</td></tr>`)},
clients(){const r=CL.map(c=>{const os=O.filter(o=>o.client===c);return`<tr><td>${esc(c)}</td><td class="n">${os.length}</td><td class="n">${A.filter(a=>a.client===c&&a.type==='profiling').length}</td><td>${os.some(o=>o.out&&o.out.r==='deal')?badge('deal'):'<span class="hint">Belum ada Deal</span>'}</td></tr>`});
 return['List client','Data contoh. Format List Client resmi perlu dikonfirmasi mitra.',tbl(['Client','#Penawaran','#Profiling','Hasil'],r)]},
indicators(){const r=[...IND,{...DIVT,m:'Jumlah (sum) divisi'}].map(i=>`<tr><td>${i.n}</td><td>${i.cat}</td><td>${i.u}</td><td>${i.m}</td><td>Benefit</td><td>${i.ty?TY[i.ty]:'Gabungan aktivitas divisi'}</td><td><span class="b ok"><i></i>Aktif</span></td></tr>`);
 return['Kategori dan indikator KPI','Kategori mencakup perusahaan, divisi, dan individu. Daftar indikator masih contoh sampai dikonfirmasi mitra.',`<div class="grid"><div class="stat"><span>Perusahaan</span><b>0</b></div><div class="stat"><span>Divisi</span><b>1</b></div><div class="stat"><span>Individu</span><b>${IND.length}</b></div></div>${tbl(['Indikator','Kategori','Satuan','Pengukuran','Arah','Dipetakan dari','Status'],r)}`]},
targets(){const m=S.period;const r=[...IND.map(i=>[i.n,'Individu',i.u,i.t]),[DIVT.n,'Divisi Marketing',DIVT.u,DIVT.t]].map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td><td>${PER.find(p=>p.k===m).n}</td><td class="n">${x[3].toLocaleString('id-ID')} ${x[2]}</td></tr>`);
 return['Target KPI','Target terikat ke indikator, periode, dan cakupan yang jelas.',`<div class="fb"><div><label>Periode</label>${perSel()}</div></div>${tbl(['Indikator','Cakupan','Periode','#Target'],r)}`]},
achievements(){return kpiPage('Realisasi KPI','Realisasi hanya dihitung dari aktivitas disetujui yang memiliki pemetaan indikator. Pilih angka untuk melihat sumbernya.',team())},
team(){return kpiPage('Kinerja tim','Realisasi anggota tim pada periode terpilih.',team())},
perf(){return kpiPage('Kinerja saya','Realisasi dari aktivitas Anda yang sudah disetujui.',[me()])},
reports(){const r=team().map(e=>{const as=A.filter(a=>a.owner===e&&a.date.startsWith(S.period));const c=k=>as.filter(a=>a.status===k).length;return`<tr><td>${nm(e)}</td><td>${EMP[e].d}</td><td class="n">${as.length}</td><td class="n">${c('approved')}</td><td class="n">${c('pending')}</td><td class="n">${c('revision')}</td><td class="n">${c('rejected')}</td></tr>`});
 return['Laporan','Rekap aktivitas per karyawan pada periode terpilih.',`<div class="fb"><div><label>Periode</label>${perSel()}</div><div><label>Divisi</label><select disabled><option>Marketing</option></select></div></div>${tbl(['Karyawan','Divisi','#Total','#Disetujui','#Menunggu','#Revisi','#Ditolak'],r)}`]},
periods(){const r=PER.map(p=>`<tr><td>${p.n}</td><td>${p.k}-01 s/d ${p.k}-${p.k==='2026-11'?30:31}</td><td>${p.st==='Aktif'?'<span class="b ok"><i></i>Aktif</span>':'<span class="b mu"><i></i>Ditutup</span>'}</td><td>${p.st==='Aktif'?'<button class="btn sm s" data-a="close" data-k="'+p.k+'">Tutup periode</button>':'<span class="hint">Tidak dapat diubah pengguna biasa</span>'}</td></tr>`);
 return['Periode penilaian','HRD memilih periode. Periode yang ditutup tidak menerima aktivitas baru.',tbl(['Periode','Rentang','Status','Aksi'],r)]},
employees(){const r=Object.entries(EMP).map(([k,e])=>`<tr><td>${e.n}</td><td>${RL[e.r]}</td><td>${e.d}</td><td>${e.p}</td><td>${e.s?nm(e.s):'-'}</td></tr>`);
 return['Karyawan','Data contoh. Akun dibuat Admin; tidak ada registrasi publik.',tbl(['Nama','Peran','Divisi','Jabatan','Supervisor'],r)]},
divisions(){const ds=[...new Set(Object.values(EMP).map(e=>e.d))];return['Divisi dan jabatan','Daftar divisi resmi perlu dikonfirmasi mitra.',tbl(['Divisi','#Karyawan','Jabatan'],ds.map(d=>`<tr><td>${d}</td><td class="n">${Object.values(EMP).filter(e=>e.d===d).length}</td><td>${[...new Set(Object.values(EMP).filter(e=>e.d===d).map(e=>e.p))].join(', ')}</td></tr>`))]},
audit(){return['Audit log','Perubahan penting dicatat: siapa, apa, dan kapan.',tbl(['Waktu','Pengguna','Tindakan'],AUD.map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td><td>${esc(x[2])}</td></tr>`))]},
spk(){return['SPK SAW (tahap TA)','Modul ini belum aktif pada rilis MKI. Hasil SAW berupa rekomendasi, bukan keputusan otomatis.',`<div class="grid"><div class="card"><h3>Benefit</h3><code>r = x / max(x)</code></div><div class="card"><h3>Cost</h3><code>r = min(x) / x</code></div><div class="card"><h3>Preferensi</h3><code>V = Σ (w × r)</code></div></div><div class="card"><h3 style="margin-bottom:8px">Alur perhitungan</h3><ol style="margin:0;padding-left:20px"><li>Pilih periode dan karyawan</li><li>Ambil kriteria, bobot, dan jenis benefit/cost (total bobot 100%)</li><li>Bentuk matriks keputusan lalu normalisasi</li><li>Hitung nilai preferensi dan ranking</li><li>Simpan snapshot hasil dan versi konfigurasi</li></ol></div><div class="al wa">Bobot, rentang predikat, dan kriteria menunggu persetujuan perusahaan.</div>`]},
denied(){return['Akses ditolak','Peran Anda tidak memiliki izin untuk halaman ini.','<button class="btn" data-a="nav" data-p="dashboard">Kembali ke dashboard</button>']}};
function mk(ty,t,d,h,row){const r=A.filter(a=>a.type===ty&&vis(a)).map(row);return[t,d,`<div class="fb"><button class="btn" data-a="nav" data-p="new">Tambah ${t.toLowerCase()}</button></div>${tbl(h,r,'Belum ada data.')}`]}
function kpiPage(t,d,emps){const m=S.period,cl=closed(m+'-01');
 const blocks=emps.map(e=>{const k=kpiOf(e,m);return`<h2 style="margin:6px 0 8px">${nm(e)}</h2>`+tbl(['Indikator','#Target','#Realisasi','Capaian'],IND.map(i=>`<tr><td>${i.n}</td><td class="n">${i.t.toLocaleString('id-ID')}</td><td class="n"><button class="lnk" data-a="src" data-e="${e}" data-i="${i.id}">${k[i.id].v.toLocaleString('id-ID')}</button> ${i.u}</td><td>${prog(k[i.id].v,i.t)}<span class="hint">${pct(k[i.id].v,i.t)}%</span></td></tr>`))});
 const tot=emps.reduce((s,e)=>s+kpiOf(e,m).i1.v,0);
 return[t,d,`<div class="fb"><div><label>Periode</label>${perSel()}</div></div>${cl?'<div class="al in">Periode ini sudah ditutup. Data hanya dapat dibaca.</div>':''}${blocks.join('')}${emps.length>1?`<div class="card"><b>${DIVT.n}</b><div class="fb" style="margin:8px 0 0"><span>${tot.toLocaleString('id-ID')} dari ${DIVT.t.toLocaleString('id-ID')} ${DIVT.u}</span>${prog(tot,DIVT.t)}</div></div>`:''}<div class="al in">Predikat nilai (Sangat Baik, Baik, Cukup, Kurang) ditampilkan setelah rentangnya disahkan perusahaan.</div>`]}
function detail(id){const a=A.find(x=>x.id===id);if(!a)return'';
 const ex=[['Pemilik',nm(a.owner)],['Pencatat',nm(a.by)],['Tanggal',fmt(a.date)],['Jenis',TY[a.type]],a.src&&['Sumber',a.src+(a.nm?' – '+a.nm:'')],a.q&&['Jumlah',a.q+' eksemplar'],a.client&&['Client',a.client],a.pot&&['Potensi',a.pot],a.offer&&['Penawaran',O.find(o=>o.id===a.offer).client],a.res&&['Hasil',a.res==='deal'?'Deal':'NO'],a.cat&&['Alasan NO',a.cat+' – '+a.why],['Deskripsi',a.desc],['Status',badge(a.status)]].filter(Boolean);
 const own=a.owner===me()||a.by===me();
 return`<header><h2>Aktivitas #${a.id}</h2><button class="btn g sm" data-a="x">Tutup</button></header><dl class="kv">${ex.map(x=>`<dt>${x[0]}</dt><dd>${x[0]==='Status'?x[1]:esc(x[1])}</dd>`).join('')}</dl><h3 style="margin-bottom:8px">Riwayat verifikasi</h3><ul class="tl">${a.h.map(h=>`<li>${badge(h[0])} ${nm(h[1])}, ${fmt(h[3])}${h[2]?`<div class="hint">${esc(h[2])}</div>`:''}</li>`).join('')}</ul>
 ${canVerify(a)?`<div class="card" style="margin:14px 0 0"><label>Catatan pemeriksaan</label><textarea id="vn" rows="2"></textarea><div class="fb" style="margin:10px 0 0"><button class="btn" data-a="ver" data-id="${a.id}" data-s="approved">Setujui</button><button class="btn s" data-a="ver" data-id="${a.id}" data-s="revision">Minta revisi</button><button class="btn d" data-a="ver" data-id="${a.id}" data-s="rejected">Tolak</button></div></div>`:a.status==='pending'&&S.role==='supervisor'?'<div class="al in" style="margin-top:14px">Anda tidak dapat memverifikasi aktivitas yang Anda buat atau miliki sendiri.</div>':''}
 ${a.status==='revision'&&own?`<div class="fb" style="margin:14px 0 0"><button class="btn" data-a="resub" data-id="${a.id}">Ajukan ulang</button></div>`:''}`}
function offerView(id){const o=O.find(x=>x.id===id);return`<header><h2>${esc(o.client)}</h2><button class="btn g sm" data-a="x">Tutup</button></header><dl class="kv"><dt>Program</dt><dd>${esc(o.prog)}</dd><dt>Nilai</dt><dd>${rp(o.val)}</dd><dt>Pemilik</dt><dd>${nm(o.owner)}</dd><dt>Hasil akhir</dt><dd>${o.out?badge(o.out.r)+(o.out.r==='no'?'<div class="hint">'+esc(o.out.cat+' – '+o.out.txt)+'</div>':''):'Belum ada hasil'}</dd></dl><h3 style="margin-bottom:8px">Progress</h3>${o.pr.length?`<ul class="tl">${[...o.pr].reverse().map(p=>`<li><b>${p[1]}</b>, ${fmt(p[0])}<div class="hint">${esc(p[2])}</div></li>`).join('')}</ul>`:'<div class="empty">Belum ada progress.</div>'}`}
function srcView(e,iid){const i=IND.find(x=>x.id===iid),k=kpiOf(e,S.period)[iid];return`<header><h2>Sumber realisasi</h2><button class="btn g sm" data-a="x">Tutup</button></header><p>${nm(e)} · ${i.n}</p>${tbl(['Tanggal','Deskripsi','#Nilai'],k.src.map(a=>`<tr><td>${fmt(a.date)}</td><td>${esc(a.desc)}</td><td class="n">${a.q||1}</td></tr>`),'Belum ada aktivitas disetujui yang terpetakan ke indikator ini.')}`}
function login(){return`<div class="login"><div class="card lc"><div class="brand"><svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" fill="#12345A"/><path d="M8 22V10h8a4 4 0 0 1 0 8h-8M15 18l6 4" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>Radar Kediri</div>
<h1 style="margin-bottom:4px">Masuk ke sistem</h1><p class="hint" style="margin:0 0 14px">Sistem informasi aktivitas dan kinerja karyawan. Akun dibuat oleh Admin; tidak ada pendaftaran publik.</p>
<label>Email</label><input value="nama@radarkediri.example" aria-label="Email"><label style="margin-top:10px">Kata sandi</label><input type="password" value="contohsandi" aria-label="Kata sandi">
<p style="margin:16px 0 4px;font-weight:500">Pilih peran untuk mencoba prototipe</p><div class="roles">${Object.keys(RL).map(r=>`<button class="btn s" data-a="login" data-r="${r}">${RL[r]}</button>`).join('')}</div>
<p class="hint" style="margin-top:14px">Prototipe memakai data contoh. Autentikasi dan data sebenarnya memakai Supabase pada versi Astro SSR.</p></div></div>`}
function shell(){const [t,d,body]=(allowed().includes(S.page)?P[S.page]:P.denied)();const cur=allowed().includes(S.page)?S.page:'';
 const item=x=>`<button class="nav" data-a="nav" data-p="${x[0]}"${x[0]===cur?' aria-current="page"':''}>${x[1]}</button>`;
 return`<div class="app"><aside class="side${S.nav?' open':''}"><div class="brand"><svg width="28" height="28" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" fill="#fff"/><path d="M8 22V10h8a4 4 0 0 1 0 8h-8M15 18l6 4" stroke="#12345A" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>Radar Kediri</div>
 ${NAV[S.role].map(item).join('')}${S.role==='supervisor'||S.role==='employee'?`<div class="grp">Marketing</div>${MK.map(item).join('')}`:''}</aside>
 <div class="main"><header class="top"><button class="btn s sm burger" data-a="burger" aria-label="Buka menu">Menu</button><div class="sp"></div>
 <div style="width:190px">${perSel()}</div><div class="who"><b>${nm(me())}</b>${RL[S.role]}</div><button class="btn s sm" data-a="logout">Keluar</button></header>
 <main class="page"><div class="crumb">Radar Kediri / ${esc(t)}</div>${ph(t,d)}${body}</main></div></div>${S.modal?`<div class="mo" data-a="bg"><div class="mb" role="dialog" aria-modal="true">${S.modal}</div></div>`:''}${S.toast?`<div class="toast" role="status">${esc(S.toast)}</div>`:''}`}
function render(){$('#root').innerHTML=S.role?shell():login();if(S.role&&S.page==='new')syncForm()}
function syncForm(){const f=$('#af');if(!f)return;const ty=f.type.value,rs=f.res&&f.res.value;f.querySelectorAll('[data-t]').forEach(x=>{const k=x.dataset.t.split(' ');x.style.display=k.includes(ty)||(k.includes('no')&&ty==='hasil'&&rs==='no')?'':'none'})}
function toast(t){S.toast=t;render();setTimeout(()=>{S.toast='';render()},2600)}
function go(p){S.page=p;S.nav=false;S.modal=null;S.err='';render();window.scrollTo(0,0)}
function submit(f){const g=n=>f[n]?f[n].value.trim():'';const own=f.owner.value,ty=g('type'),dt=g('date');let e='';
 if(!dt)e='Tanggal wajib diisi.';else if(closed(dt))e='Periode untuk tanggal ini sudah ditutup. Pilih tanggal pada periode aktif.';
 else if(g('desc').length<10)e='Deskripsi minimal 10 karakter agar dapat diverifikasi.';
 else if(ty==='oplah'&&!(+g('q')>0))e='Jumlah oplah harus lebih dari 0.';
 else if(ty==='hasil'&&g('res')==='no'&&(!g('cat')||!g('why')))e='Hasil NO wajib disertai kategori dan penjelasan alasan.';
 if(e){S.err=e;render();return}
 const id=Math.max(...A.map(a=>a.id))+1,a={id,date:dt,type:ty,owner:own,by:me(),desc:g('desc'),status:'pending',h:[['pending',me(),'Dibuat',TODAY]]};
 if(ty==='oplah'){a.src=g('src');a.nm=g('nm');a.q=+g('q')}
 if(['profiling','program','penawaran'].includes(ty))a.client=g('client');
 if(ty==='profiling')a.pot=g('pot');
 if(ty==='penawaran'){const oid='o'+(O.length+1);O.push({id:oid,client:a.client,prog:a.desc.slice(0,40),val:+g('val')||0,owner:own,date:dt,pr:[],out:null});a.offer=oid}
 if(ty==='progress'||ty==='hasil'){a.offer=g('offer');const o=O.find(x=>x.id===a.offer);if(ty==='progress')o.pr.push([dt,'Progress',a.desc]);else{a.res=g('res');if(a.res==='no'){a.cat=g('cat');a.why=g('why')}o.out={r:a.res,cat:a.cat||'',txt:a.why||''}}}
 A.push(a);logA('Membuat aktivitas #'+id);S.err='';S.page='activities';toast('Aktivitas tersimpan dan menunggu verifikasi.')}
document.addEventListener('click',ev=>{const t=ev.target.closest('[data-a]');if(!t)return;const a=t.dataset.a,d=t.dataset;
 if(a==='bg'){if(ev.target===t){S.modal=null;render()}return}
 if(a==='login'){S.role=d.r;S.page='dashboard';render()}
 else if(a==='logout'){S.role=null;S.modal=null;render()}
 else if(a==='nav')go(d.p);
 else if(a==='burger'){S.nav=!S.nav;render()}
 else if(a==='x'){S.modal=null;render()}
 else if(a==='open'){S.modal=detail(+d.id);render()}
 else if(a==='offer'){S.modal=offerView(d.id);render()}
 else if(a==='src'){S.modal=srcView(d.e,d.i);render()}
 else if(a==='ver'){const x=A.find(z=>z.id===+d.id);if(!canVerify(x))return;const n=($('#vn')||{}).value||'';if(d.s!=='approved'&&!n.trim()){const b=$('#vn');b.focus();b.placeholder='Catatan wajib diisi untuk menolak atau meminta revisi';return}
  x.status=d.s;x.h.push([d.s,me(),n,TODAY]);logA(BD[d.s][0]+' aktivitas #'+x.id);S.modal=null;toast('Status aktivitas diperbarui.')}
 else if(a==='resub'){const x=A.find(z=>z.id===+d.id);x.status='pending';x.h.push(['pending',me(),'Diajukan ulang',TODAY]);logA('Mengajukan ulang aktivitas #'+x.id);S.modal=null;toast('Aktivitas diajukan ulang.')}
 else if(a==='close'){if(confirm('Tutup periode ini? Pengguna biasa tidak dapat mengubahnya lagi.')){PER.find(p=>p.k===d.k).st='Ditutup';logA('Menutup periode '+d.k);toast('Periode ditutup.')}}});
document.addEventListener('change',ev=>{const t=ev.target;if(t.closest('#af')){syncForm();return}
 if(t.dataset.f==='period'){S.period=t.value;render()}else if(t.dataset.f==='st'||t.dataset.f==='ty'){S.f[t.dataset.f]=t.value;render()}});
document.addEventListener('submit',ev=>{ev.preventDefault();if(ev.target.id==='af')submit(ev.target)});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&S.modal){S.modal=null;render()}});
render();
</script>
</body>
</html>
